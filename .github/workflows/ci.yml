name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: grading_service/requirements.txt
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install dependencies
        run: pip install -r grading_service/requirements.txt pytest
      - name: Install graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Run tests
        run: pytest scripts/ -q
      - name: Check generated files are in sync with their sources
        run: |
          python scripts/export_problems.py
          python scripts/build_solutions.py
          python scripts/build_knowledge.py
          git diff --exit-code

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
